name: Update Stats

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Profile Views
        uses: jwenjian/visitor-count-action@v1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
